name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/openapi.json'
  workflow_call:

permissions:
  contents: read

# the literal prefix and the workflow name keep a direct run and a run called
# from the deploy workflow in separate groups, so neither cancels the other
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:check
      - run: npx -y @redocly/cli@2.62.1 lint docs/openapi.json
      - run: npm run test:unit
      - run: npm run budget

  verify:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:contract
      - run: npm audit --audit-level=high --omit=dev
