name: staging

# the Netlify free plan cannot build from a private organisation repository.
# Render deploys the staging API from develop on its own
on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build the web app
        run: npm run build -w packages/contract && npm run build -w apps/web
        env:
          API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}

      - name: Deploy the web app on Netlify
        run: npx --yes netlify-cli deploy --prod --no-build --filter @fedsa/web --dir apps/web/dist --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}

      # a sleeping free Render service takes up to a minute to answer
      - name: Check the API through the Netlify rewrite
        run: curl -fsS --retry 3 --retry-all-errors --max-time 90 "$STAGING_URL/api/health"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
