name: zap

# a passive scan with no attack traffic. never point it at production
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # a sleeping free Render service takes up to a minute to answer
      - name: Wake the staging API
        run: curl -fsS --retry 3 --retry-all-errors --max-time 90 "$STAGING_URL/api/health"
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}

      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          allow_issue_writing: false
          artifact_name: zap-baseline
